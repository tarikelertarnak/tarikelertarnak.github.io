<!DOCTYPE html>

<head>

    Onceki icerik: Tarık Eler'in eski Next.js portfolio surumu.

  <style>
    html { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #18181b;
      text-align: center;
      padding: 2rem;
    }
    .card { max-width: 34rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; letter-spacing: -0.01em; }
    p { margin: 0 0 1.25rem; color: #52525b; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.1rem;
      border-radius: 6px;
      background: #3b82f6;
      color: #000;
      font-weight: 500;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0c; color: #ededed; }
      p { color: #a1a1aa; }
      a { background: #2563eb; color: #fff; }

    <p>
